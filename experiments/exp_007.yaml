exp_id: "exp_007"
description: "Streak-Risk Reminder Policy vs. Control"
variants:
  variant_a:
    name: "Treatment"
    description: "Fires streak-risk reminders at shrinking intervals at 20:00, 21:00, 21:30 and 21:45 learner local time (cut off by quiet hours at 22:00) when the streak is at risk; each reminder is sent on in-app, push and email (email only with an address), and the push copy is the treatment message"
  variant_b:
    name: "Control"
    description: "Suppresses streak-risk interventions; observes baseline learner behavior"
assignment:
  algorithm: "hash_v2"
  function: "bucket = int.from_bytes(sha256(json.dumps([subject_id, exp_id], separators=(',', ':')).encode('utf-8')).digest()[:8], 'big') mod 100, i.e. the first 8 bytes of the SHA-256 of the compact UTF-8 JSON array [subject_id, exp_id], read as a big-endian unsigned integer, mod 100; bucket < 50 -> variant_a (propensity 0.5), otherwise variant_b. The JSON array deliberately avoids plain concatenation, which collides: ('ab', 'c') and ('a', 'bc') would both hash 'abc'."
  split: "50/50"
exclusions:
  - "platform_tenure < 3 days"
  - "opted_out_of push × streak_risk consent pair"
primary_metric:
  name: "First eligible checkpoint mastery"
  definition: "Percent of all assigned eligible learners who pass their first eligible checkpoint within 14 days of assignment"
  matching: "CheckpointAttempt matches CheckpointCompleted by attempt_id and assessment_id/version; checkpoint_completed is not ingested, so the runner derives exactly one completion per stored CheckpointAttempted event (same attempt, assessment and version, passed as stored)"
  missing_outcome: "Learners who never complete the assessment count as not mastered; report missing-outcome rate separately"
  assessment: "Use the same assessment for everyone, or report results by difficulty level"
fatigue_metrics:
  - "messages per learner per day"
  - "opt-outs"
  - "cap breaches"
fatigue_cap: "5 messages per learner per channel per local calendar day (in-app, push and email each have their own 5; resets at the learner's local midnight)"
events:
  - "assignment"
  - "eligibility"  # experiment store row, not a learner event
  - "decision"  # experiment store row, not a learner event
  - "delivery"
  - "exposure"
consent_and_fatigue: "The treatment and control groups use the same consent and fatigue rules"
data_scope: "Synthetic data; results do not demonstrate real-world causality"
guardrails:
  - type: "notification_cap"
    description: "Notifications must not exceed 5 messages per learner per channel per local calendar day"
    reference: "§5.3"
  - type: "gaming_threshold"
    description: "Cohort decayed-XP share (XP awarded on repeat completions, repeat_index >= 1) must not exceed 15% of weekly total"
    reference: "§5.3"
srm_check:
  test: "chi_square"
  expected_split: "50/50"
  alert_threshold: "p < 0.001"
  frequency: "every run_experiment report (run it daily; nothing schedules it)"
