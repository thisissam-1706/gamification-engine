exp_id: "exp_007"
description: "Streak-Risk Reminder Policy vs. Control"
variants:
  variant_a:
    name: "Treatment"
    description: "Fires automated exponential-interval push reminder during the 4 hours preceding localized midnight when streak is at risk"
  variant_b:
    name: "Control"
    description: "Suppresses streak-risk interventions; observes baseline learner behavior"
assignment:
  algorithm: "hash_v2"
  function: "H(subject_id || 'exp_007') mod 100"
  split: "50/50"
exclusions:
  - "platform_tenure < 3 days"
  - "opted_out_of push × streak_risk consent pair"
primary_metric:
  name: "First eligible checkpoint mastery"
  definition: "Percent of all assigned eligible learners who pass their first eligible checkpoint within 14 days of assignment"
  matching: "CheckpointAttempt matches CheckpointCompleted by attempt_id and assessment_id/version"
  missing_outcome: "Learners who never complete the assessment count as not mastered; report missing-outcome rate separately"
  assessment: "Use the same assessment for everyone, or report results by difficulty level"
fatigue_metrics:
  - "messages per learner per day"
  - "opt-outs"
  - "cap breaches"
fatigue_cap: "5 messages per 24 hours"
events:
  - "assignment"
  - "eligibility"
  - "decision"
  - "delivery"
  - "exposure"
consent_and_fatigue: "The treatment and control groups use the same consent and fatigue rules"
data_scope: "Synthetic data; results do not demonstrate real-world causality"
guardrails:
  - type: "notification_cap"
    description: "Push notifications must not exceed 5 messages per 24 hours"
    reference: "§5.3"
  - type: "gaming_threshold"
    description: "Cohort decayed-XP share must not exceed 15% of weekly total"
    reference: "§5.3"
srm_check:
  test: "chi_square"
  expected_split: "50/50"
  alert_threshold: "p < 0.001"
  frequency: "daily"
