<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streakwise - Demo split view</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="topbar demo-topbar">
    <a class="brand" href="demo.html" aria-label="Streakwise demo home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 32" width="40" height="32" role="img" aria-label="Streakwise"><defs><linearGradient id="swg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E5383B"/><stop offset=".42" stop-color="#F48C06"/><stop offset="1" stop-color="#2BB24C"/></linearGradient></defs><g transform="translate(1.69 23.86) scale(0.02989 -0.02989)" fill="url(#swg)"><path d="M280 -16Q218 -16 161.0 -7.0Q104 2 57.5 18.5Q11 35 -23 55L68 229Q107 207 146.5 192.5Q186 178 225.5 171.0Q265 164 304 164Q335 164 355.5 169.0Q376 174 386.5 183.5Q397 193 397 205Q397 221 379.0 231.0Q361 241 331.5 249.0Q302 257 266.5 265.5Q231 274 195.0 287.5Q159 301 129.5 322.0Q100 343 82.0 375.0Q64 407 64 453Q64 533 106.5 592.0Q149 651 228.5 683.5Q308 716 418 716Q496 716 563.5 700.5Q631 685 680 656L595 484Q553 510 503.5 523.0Q454 536 403 536Q369 536 346.0 529.5Q323 523 311.5 512.0Q300 501 300 489Q300 473 318.0 462.5Q336 452 366.0 444.5Q396 437 431.5 428.5Q467 420 502.5 407.5Q538 395 568.0 374.5Q598 354 616.0 322.5Q634 291 634 245Q634 167 591.0 108.5Q548 50 468.5 17.0Q389 -16 280 -16Z"/><path transform="translate(610 -190) scale(0.5)" d="M175 0 91 700H324L391 109H269L577 700H794L853 109H738L1045 700H1277L913 0H660L607 484H679L428 0Z"/></g></svg>
      </span>
      <span class="brand-name">Demo split view</span>
    </a>
    <!-- One row: learner, admin, clock, the three most used clock moves, and a "more" menu. -->
    <div class="demo-controls">
      <label for="demo-learner" class="sr-only">Choose learner</label>
      <select id="demo-learner" class="learner-select"></select>
      <a class="btn-small" id="admin-link" href="admin.html">Admin</a>
      <span class="muted" id="demo-clock" title="Demo clock (UTC)">Loading clock...</span>
      <button class="btn-small" id="freeze-clock" type="button">Freeze clock</button>
      <button class="btn-small" id="same-day" type="button">Same day, evening</button>
      <button class="btn-small" id="next-day" type="button">Next day</button>
      <button class="demo-badge" id="push-badge" type="button" hidden></button>
      <div class="demo-more">
        <button class="btn-small demo-more-toggle" id="more-toggle" type="button" aria-haspopup="true"
                aria-expanded="false" aria-controls="more-menu" title="More demo controls">&#8943;</button>
        <div class="demo-menu" id="more-menu" hidden>
          <div class="demo-menu-label">Clock</div>
          <button class="demo-menu-item" id="plus-1h" type="button">+1 hour</button>
          <button class="demo-menu-item" id="plus-6h" type="button">+6 hours</button>
          <button class="demo-menu-item" id="tonight-23" type="button">Tonight 23:00</button>
          <button class="demo-menu-item" id="skip-day" type="button">Skip a day</button>
          <div class="demo-menu-label">Push</div>
          <button class="demo-menu-item" id="push-provider" type="button" title="Simulate the push provider (Firebase/APNs) going down">Push provider: up</button>
          <button class="demo-menu-item" id="push-permission" type="button">Show pushes as browser notifications</button>
          <p class="demo-menu-note" id="push-provider-note"></p>
          <div class="demo-menu-sep"></div>
          <button class="demo-menu-item demo-menu-danger" id="reset-demo" type="button">Reset demo</button>
        </div>
      </div>
    </div>
  </header>
  <div class="error demo-error" id="demo-error" role="alert" hidden>
    <span id="demo-error-text"></span>
  </div>
  <main class="demo-layout">
    <section class="demo-pane" aria-labelledby="lesson-pane-title">
      <h1 id="lesson-pane-title">Lesson</h1>
      <iframe id="lesson-frame" title="Fractions lesson" loading="eager"></iframe>
    </section>
    <section class="demo-pane" aria-labelledby="home-pane-title">
      <h1 id="home-pane-title">Learner home</h1>
      <iframe id="home-frame" title="Learner home" loading="eager"></iframe>
    </section>
  </main>
  <script src="push-notify.js"></script>
  <script src="demo.js"></script>
</body>
</html>
